[package]
name = "ed301-eddsa-secret-taint"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
description = "Valgrind secret-taint harness for Ed301-EdDSA-draft-00"
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[features]
default = ["instrumented"]
instrumented = [
    "ed301-eddsa/secret-taint-instrumentation",
    "ed301-eddsa/x301",
]

[dependencies]
ed301-eddsa = { path = "../crates/ed301-eddsa", features = ["x301"] }
ed301-valgrind-client = { path = "valgrind-client" }

[[bin]]
name = "ed301-eddsa-secret-taint"
path = "src/main.rs"

[workspace]
members = ["valgrind-client"]
resolver = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = true
debug = 1

[profile.release.package."crypto-bigint:0.7.5"]
overflow-checks = false
