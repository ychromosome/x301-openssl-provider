name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify checked-out source identity
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            '${{ github.sha }}' verify-source-tree
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Expose resolved Rust binaries to hermetic gates
        run: |
          for tool in cargo rustc rustfmt cargo-fmt cargo-clippy rustdoc; do
            sudo ln -sf "$(rustup which "$tool")" "/usr/bin/$tool"
          done
      - name: Source-checked core, differential and fuzz gates
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          expected_commit='${{ github.sha }}'
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            "$expected_commit" verify-source-tree
          snapshot=$(mktemp -d)
          trap 'chmod -R u+w "$snapshot"; rm -rf "$snapshot"' EXIT
          {
            printf '%s\n' SOURCE_MANIFEST.sha256
            awk '{ print substr($0, 67) }' SOURCE_MANIFEST.sha256
          } | tar -cf - -T - | tar -xf - -C "$snapshot"
          test "$(sha256sum "$snapshot/SOURCE_MANIFEST.sha256" \
            | awk '{ print $1 }')" = "$digest"
          chmod -R a-w "$snapshot"
          "$snapshot/scripts/run-authoritative-gate.sh" archive \
            "$digest" check
          "$snapshot/scripts/run-authoritative-gate.sh" archive \
            "$digest" run-x301-fuzz --runs 20000
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ychromosome/ed301-eddsa
          ref: eaebfe5048757c3daa2e257e9a74175ca3fe1d4c
          path: canonical-ed301
      - name: Verify shared Ed301 arithmetic provenance
        run: |
          python3 -I -B scripts/check-ed301-arithmetic-provenance.py \
            "$PWD/canonical-ed301" "$PWD"

  provider:
    needs: core
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - name: Install provider and TLS test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tools gawk iproute2 jq \
            libclang-rt-dev libssl-dev valgrind
      - name: Expose resolved Rust binaries to hermetic gates
        run: |
          for tool in cargo rustc rustfmt cargo-fmt cargo-clippy rustdoc; do
            sudo ln -sf "$(rustup which "$tool")" "/usr/bin/$tool"
          done
      - name: Build and test OpenSSL 3.5.8 and 4.0.2 lanes
        env:
          GLIBC_TUNABLES: ""
          LD_AUDIT: ""
          LD_LIBRARY_PATH: ""
          LD_PRELOAD: ""
        shell: /usr/bin/env -S -i PATH=/usr/bin:/bin HOME=/tmp LC_ALL=C /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          expected_commit='${{ github.sha }}'
          digest=$(sha256sum SOURCE_MANIFEST.sha256 | awk '{ print $1 }')
          scripts/run-authoritative-gate.sh git "$digest" \
            "$expected_commit" verify-source-tree
          snapshot=$(mktemp -d)
          work=$(mktemp -d)
          trap 'chmod -R u+w "$snapshot" "$work"; rm -rf "$snapshot" "$work"' EXIT
          {
            printf '%s\n' SOURCE_MANIFEST.sha256
            awk '{ print substr($0, 67) }' SOURCE_MANIFEST.sha256
          } | tar -cf - -T - | tar -xf - -C "$snapshot"
          test "$(sha256sum "$snapshot/SOURCE_MANIFEST.sha256" \
            | awk '{ print $1 }')" = "$digest"
          chmod -R a-w "$snapshot"
          mkdir "$work/upstream"
          for item in \
              '3.5.8 a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2' \
              '4.0.2 736b467530f916737b7031310ccb21d8218c6229e61e8e160cd1d3458cd543a8'; do
            read -r version tarball_sha256 <<<"$item"
            curl -fL --retry 3 --proto '=https' --proto-redir '=https' \
              "https://www.openssl.org/source/openssl-$version.tar.gz" \
              -o "$work/upstream/openssl-$version.tar.gz"
            printf '%s  %s\n' "$tarball_sha256" \
              "openssl-$version.tar.gz" \
              >"$work/upstream/openssl-$version.tar.gz.sha256"
            "$snapshot/scripts/run-authoritative-gate.sh" archive "$digest" \
              build-openssl-provider-lane "$version" "$work/upstream" \
              "$work/lane-$version"
          done
          lane_358_digest=$(sha256sum \
            "$work/lane-3.5.8/logs/3.5.8/evidence_manifest.sha256" \
            | awk '{ print $1 }')
          lane_402_digest=$(sha256sum \
            "$work/lane-4.0.2/logs/4.0.2/evidence_manifest.sha256" \
            | awk '{ print $1 }')
          result_root="$PWD/provider-results"
          mkdir "$result_root"
          prefix="$work/lane-3.5.8/inst/3.5.8"
          mkdir "$work/cargo-home" "$work/provider-target"
          env -i PATH=/usr/bin:/bin HOME="$work" LC_ALL=C \
            CARGO_HOME="$work/cargo-home" \
            CARGO_TARGET_DIR="$work/provider-target" \
            CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0 \
            CC=/usr/bin/gcc AR=/usr/bin/ar \
            X301_HERMETIC_PROVIDER_BUILD=1 \
            OPENSSL_INCLUDE_DIR="$prefix/include" \
            OPENSSL_LIB_DIR="$prefix/lib" \
            cargo fmt --manifest-path "$snapshot/provider/Cargo.toml" \
              --all -- --check
          for features in '' tls-x301-mlkem1024; do
            feature_args=()
            test -z "$features" || feature_args=(--features "$features")
            env -i PATH=/usr/bin:/bin HOME="$work" LC_ALL=C \
              CARGO_HOME="$work/cargo-home" \
              CARGO_TARGET_DIR="$work/provider-target" \
              CARGO_NET_OFFLINE=true CARGO_INCREMENTAL=0 \
              CC=/usr/bin/gcc AR=/usr/bin/ar \
              X301_HERMETIC_PROVIDER_BUILD=1 \
              OPENSSL_INCLUDE_DIR="$prefix/include" \
              OPENSSL_LIB_DIR="$prefix/lib" \
              cargo clippy --manifest-path "$snapshot/provider/Cargo.toml" \
                --locked --offline --workspace --all-targets \
                "${feature_args[@]}" -- -D warnings
          done
          "$snapshot/scripts/run-authoritative-gate.sh" archive "$digest" \
            test-x301-provider-contracts --result-root "$result_root/contracts" \
            "$work/lane-3.5.8" "$lane_358_digest" \
            "$work/lane-4.0.2" "$lane_402_digest"
          "$snapshot/scripts/run-authoritative-gate.sh" archive "$digest" \
            test-x301-tls --result-root "$result_root/tls" \
            "$work/lane-3.5.8" "$lane_358_digest" \
            "$work/lane-4.0.2" "$lane_402_digest"
          for version in 3.5.8 4.0.2; do
            "$snapshot/scripts/run-authoritative-gate.sh" archive "$digest" \
              check-x301-timing --measurements 200000 \
              "$work/lane-$version/inst/$version" \
              "$result_root/contracts/$version/modules" \
              "$result_root/timing-$version"
          done
      - name: Preserve timing and code-generation receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: x301-${{ matrix.runner }}-receipts
          path: |
            provider-results/timing-3.5.8
            provider-results/timing-4.0.2
            provider-results/contracts/3.5.8/final-codegen
            provider-results/contracts/4.0.2/final-codegen
          if-no-files-found: error
          retention-days: 14

  rpm-contract:
    runs-on: ubuntu-24.04
    container: fedora:45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Fedora 45 source RPM contract
        run: |
          dnf -qy install crypto-policies-scripts curl git rpm-build ShellCheck
          shellcheck scripts/check-rpm-packaging.sh \
            scripts/test-rpm-policy-overlay.sh scripts/test-rpm-install.sh
          scripts/check-rpm-packaging.sh
          scripts/test-rpm-policy-overlay.sh
          topdir=$(mktemp -d)
          mkdir -p "$topdir/SOURCES"
          commit=$(awk '$1 == "%global" && $2 == "commit" { print $3 }' \
            packaging/rpm/x301-openssl-provider.spec)
          curl -fL --retry 3 --proto '=https' --proto-redir '=https' \
            "https://github.com/ychromosome/x301-openssl-provider/archive/$commit/x301-openssl-provider-$commit.tar.gz" \
            -o "$topdir/SOURCES/x301-openssl-provider-$commit.tar.gz"
          awk '$1 ~ /^(Source[1-9][0-9]*|Patch[0-9]+):$/ { print $2 }' \
            packaging/rpm/x301-openssl-provider.spec \
            | while IFS= read -r source; do
                cp "packaging/rpm/$source" "$topdir/SOURCES/"
              done
          rpmbuild -bs --nodeps --define "_topdir $topdir" \
            packaging/rpm/x301-openssl-provider.spec
          test -n "$(find "$topdir/SRPMS" -maxdepth 1 -type f \
            -name 'x301-openssl-provider-*.src.rpm' -print -quit)"
