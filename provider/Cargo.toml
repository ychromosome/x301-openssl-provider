[workspace]
members = ["crates/ed301-eddsa-provider", "crates/x301-provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = true

# Cargo profiles are not transitive.  The provider workspace therefore
# repeats the crypto-bigint override from the core workspace and verifies it
# in the provider acceptance lane.
[profile.release.package."crypto-bigint:0.7.5"]
overflow-checks = false
