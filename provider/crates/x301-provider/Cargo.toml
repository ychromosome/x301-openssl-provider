[package]
name = "x301-provider"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Experimental raw X301 provider with optional TLS X301MLKEM1024 integration"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "x301"
crate-type = ["cdylib"]
path = "src/lib.rs"

[features]
default = []
test-failpoint = []
test-fuzz-coverage = []
test-sanitizer = []
tls-x301-mlkem1024 = []
secret-taint-instrumentation = [
    "ed301-eddsa/secret-taint-instrumentation",
    "dep:ed301-valgrind-client",
]

[dependencies]
crypto-bigint = { version = "=0.7.5", default-features = false }
ed301-eddsa = { path = "../../../crates/ed301-eddsa", default-features = false, features = ["x301"] }
ed301-valgrind-client = { path = "../../../secret-taint/valgrind-client", optional = true }
zeroize = { version = "=1.9.0", default-features = false }
